name: Close issue 19

on:
  push:
    branches:
      - chore/close-issue-19
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #19
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Closed as completed (covered by #8 + #29)

          Issue #19 asked to centralize API error responses via a shared helper and Express error middleware. That is fully delivered across:

          - **#8** (`fix/issue-8` @ `8ae9cd8453a5478570f9533f62c115012f0cf89a`) — `sendServerError` so catch paths log server-side and return `{ message, code }` only
          - **#29** (`fix/issue-29` @ `6f743653e891962cbca6cdbe1f5f2f2d4dde8cc7`) — extends `api/utils/httpErrors.js` with `sendError` / `HttpError` / `errorHandler`, wires app-level middleware, aligns auth + 4xx controllers/routes to `{ message, code, details? }`, updates OpenAPI + client parser

          No further code changes needed on `fix/issue-19` beyond what #8+#29 already shipped.
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 19 --repo luizerico/baseapp --body "$body"
          gh issue close 19 --repo luizerico/baseapp --reason completed
          mkdir -p scripts
          printf '%s\n' '{"issue":19,"state":"closed","outcome":"closed-as-covered","coveredBy":["fix/issue-8","fix/issue-29"],"sha":"6f743653e891962cbca6cdbe1f5f2f2d4dde8cc7"}' > scripts/close-issue-19-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-19-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit -m "Record close of issue #19 (covered by #8+#29)"
            git push
          fi
