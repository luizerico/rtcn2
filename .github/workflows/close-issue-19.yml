name: Close issue 19

on:
  push:
    branches:
      - chore/close-issue-19
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #19
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Fixed on `fix/issue-19`

          Centralized API error responses on top of #8:

          - Expanded `api/utils/httpErrors.js` with `sendError`, `HttpError`, `asyncHandler` (kept `sendServerError`)
          - Added Express `errorHandler` middleware (`api/middleware/errorMiddleware.js`) wired in `api/app.js`
          - Migrated auth controller + auth middleware onto the shared helpers
          - Documented optional `code` on OpenAPI `ErrorMessage`
          - Tests: `__tests__/api.httpErrors.test.js` (7 passing)

          Builds on #8 (`8ae9cd8`). Commit: `ca378ed01354e8d1200663bed77edb82e9854978`
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 19 --repo luizerico/baseapp --body "$body"
          gh issue close 19 --repo luizerico/baseapp --reason completed
          mkdir -p scripts
          echo '{"issue":19,"state":"closed","branch":"fix/issue-19","sha":"ca378ed01354e8d1200663bed77edb82e9854978"}' > scripts/close-issue-19-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-19-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit -m "Record close of issue #19"
            git push
          fi
