name: Seed review issues

on:
  push:
    branches:
      - chore/seed-review-issues
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub issues from review findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          chmod +x scripts/seed-review-issues.sh
          bash scripts/seed-review-issues.sh

      - name: Commit updated review markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REVIEW_*.md scripts/seed-review-issues-result.json || true
          if git diff --cached --quiet; then
            echo "No markdown updates to commit"
          else
            git commit -m "Link review findings to GitHub issues"
            git push
          fi
