name: Close issue 2 superseded

on:
  push:
    branches:
      - chore/close-issue-2-superseded
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #2 as superseded by #14
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Completed / superseded by #14

          Issue #2 is fully addressed by the fix on **`fix/issue-14`** — no separate reimplementation needed.

          ### Coverage vs #2
          - Mongo session validation matching Express `protect` (`sid`, `tokenHash`, revoke/expiry)
          - Admin-group RBAC for reports GraphQL (`require_reports_access`)
          - Client `isAdmin` gate on `/admin/reports`

          ### Canonical fix
          - Issue: #14
          - Branch: `fix/issue-14`
          - SHA: `b2522204232d2ab39796195f1148d7df883f1efc`
          - Duplicate branch `fix/issue-2` (`c7f2860`) can be ignored / left unused

          Closing #2 as completed via #14.
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 2 --repo luizerico/baseapp --body "$body"
          gh issue close 2 --repo luizerico/baseapp --reason completed
          mkdir -p scripts
          echo '{"issue":2,"state":"closed","superseded_by":14,"branch":"fix/issue-14","sha":"b2522204232d2ab39796195f1148d7df883f1efc"}' > scripts/close-issue-2-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-2-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit -m "Record close of issue #2 (superseded by #14)"
            git push
          fi
