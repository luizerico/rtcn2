name: Close issue 17

on:
  push:
    branches:
      - chore/close-issue-17
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #17
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Fixed on `fix/issue-17`

          Introduced shared password policy helper `api/utils/passwordPolicy.js` (`assertPasswordPolicy`) and applied it to:

          - `registerUser`, `resetPassword`, `changeOwnPassword`, `adminChangeUserPassword` in `authController`
          - `createUser` in `userController`

          Documented the shared `PasswordValue` schema (minLength 8) in OpenAPI and added unit/API coverage for weak-password rejection.

          **SHA:** `6eb9dc6fdce378e3826302c0d56386b31e575168`
          EOF
          )"
          gh issue comment 17 --body "$body"
          gh issue close 17 --reason completed
          mkdir -p scripts
          echo '{"issue":17,"branch":"fix/issue-17","sha":"6eb9dc6fdce378e3826302c0d56386b31e575168","closed":true}' > scripts/close-issue-17-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/close-issue-17-result.json
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "ci: record issue #17 close result" || exit 0
          git push
