name: Close issue 15

on:
  push:
    branches:
      - chore/close-issue-15
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Closed as duplicate / superseded by #3

          Issue #15 asked to scope survey-response APIs the same way as survey lists (`attachAccessible` + filter by granted ids + regression tests).

          That work landed on `fix/issue-3` and closed #3:

          - `GET /api/surveys/:id/responses` uses `authorize('SURVEY_RESPONSE:READ', { allowAnyInstance: true, attachAccessible: true })`
          - `listSurveyResponses` filters to class-wide access or granted `SURVEY_RESPONSE` resource ids (same pattern as `listSurveys`)
          - Allow/deny IDOR coverage in `__tests__/api.surveyResponses.idor.test.js`

          Other survey-response endpoints do not need the same list scoping:
          - `POST /api/surveys/:id/responses` correctly uses class-wide `SURVEY_RESPONSE:CREATE`
          - Asset create/update routes redirect Survey/SurveyResponse to the surveys API

          No additional code changes on `fix/issue-15`.

          Superseding commit: bff95e4afe201cf4a8e17e83fa4fbb3bcf21432f (`fix/issue-3`)
          Related: #3
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 15 --repo luizerico/baseapp --body "$body"
          gh issue close 15 --repo luizerico/baseapp --reason completed
          echo '{"issue":15,"state":"closed","reason":"duplicate-superseded-by-3","branch":"fix/issue-3","sha":"bff95e4afe201cf4a8e17e83fa4fbb3bcf21432f"}' > scripts/close-issue-15-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-15-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit -m "Record close of issue #15"
            git push
          fi
