name: Close issues 7 and 13
on:
  workflow_dispatch:
  push:
    branches: [chore/close-issue-7]
permissions:
  issues: write
  contents: read
jobs:
  comment-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close overlapping rate-limit issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="fix/issue-7"
          SHA="cd6ea41a477aaf8944b7f21ac8b0b8a270dd4e09"
          BODY7="$(cat <<EOF
Fixed on branch \`$BRANCH\` (\`$SHA\`).

- Helmet security headers (CSP/COEP disabled for Next.js compatibility)
- JSON body size limit (\`100kb\` default)
- Global \`/api\` rate limit + stricter limit on auth register/login/forgot/reset
- Rate limiters skipped when \`NODE_ENV=test\` so Jest/supertest keep working

Also covers #13 (same Express-edge hardening).
EOF
)"
          BODY13="$(cat <<EOF
Fully covered by the fix for #7 on \`$BRANCH\` (\`$SHA\`).

Helmet + JSON body limit + global API rate limit + stricter auth rate limits were added in that change; closing as duplicate/overlap of #7.
EOF
)"
          gh issue comment 7 --repo luizerico/baseapp --body "$BODY7"
          gh issue close 7 --repo luizerico/baseapp --reason completed --comment "Closing: rate limiting and baseline HTTP security middleware shipped on \`$BRANCH\`."
          gh issue comment 13 --repo luizerico/baseapp --body "$BODY13"
          gh issue close 13 --repo luizerico/baseapp --reason completed --comment "Closing as fully covered by #7 (\`$BRANCH\` / \`$SHA\`)."
