name: Close issue 12

on:
  push:
    branches:
      - chore/close-issue-12
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Fixed on `fix/issue-12`

          Ensured Asset POST always applies CREATE authorization for every kind, including survey kinds.

          - Removed the `SURVEY` / `SURVEY_RESPONSE` `next()` bypass in `api/routes/assetRoutes.js`
          - All valid kinds now require `${kind}:CREATE` before `createAsset` (controller still returns 400 directing clients to the surveys API)
          - Added unprivileged deny coverage for survey kinds on POST `/api/assets` in `__tests__/api.rbac.test.js`

          Commit: 0149fe9f1cab3856a4676894f45cedec22f348d5
          Compare: https://github.com/luizerico/baseapp/compare/base_platform...fix/issue-12
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 12 --repo luizerico/baseapp --body "$body"
          gh issue close 12 --repo luizerico/baseapp --reason completed
          mkdir -p scripts
          echo '{"issue":12,"state":"closed","branch":"fix/issue-12","sha":"0149fe9f1cab3856a4676894f45cedec22f348d5"}' > scripts/close-issue-12-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-12-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Record close of issue #12"
            git push
          fi