name: Clarify issue 11 superseded

on:
  push:
    branches:
      - chore/close-issue-11
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  clarify-superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment that #11 is superseded by #37
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Completed / superseded by #37

          Issue #11 (`isVerified` never enforced at login) is fully covered by the verification work in **#37**.

          Canonical fix:
          - Branch: `fix/issue-37`
          - SHA: `e2e7568093756821e6e313c00677b5251dc3038e`
          - Login and `protect` reject unverified accounts (`403 NOT_VERIFIED`)
          - Self-register stays unverified; admin create/bootstrap verified
          - Admin Users Verify/Revoke UI; docs and tests updated

          `fix/issue-11` was a duplicate of the same enforcement and should not be merged alongside #37.

          Closing #11 as completed via #37 (no additional code needed).
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 11 --repo luizerico/baseapp --body "$body"
          gh issue close 11 --repo luizerico/baseapp --reason completed || true
          mkdir -p scripts
          echo '{"issue":11,"state":"closed","outcome":"superseded_by_37","canonical_branch":"fix/issue-37","canonical_sha":"e2e7568093756821e6e313c00677b5251dc3038e","duplicate_branch":"fix/issue-11","duplicate_sha":"15d9c7bcf173749c75e18c9e14b7b0dd69aee9bc"}' > scripts/close-issue-11-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-11-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit -m "Record #11 closed as superseded by #37"
            git push
          fi
