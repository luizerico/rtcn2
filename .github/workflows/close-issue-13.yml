name: Close issue 13

on:
  push:
    branches:
      - chore/close-issue-13
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Completed / superseded by #7

          Issue #13 (Improvements) is fully covered by the #7 fix on `fix/issue-7`.

          That branch already delivers the recommended Express edge protections:
          - Helmet security headers (CSP/COEP off for unified Next.js)
          - JSON body size limit (default `100kb`) with 413 handling
          - Mild global `/api` rate limit
          - Stricter auth rate limits on login / register / forgot-password / reset-password

          **Canonical branch:** `fix/issue-7`
          **SHA:** `cd6ea41a477aaf8944b7f21ac8b0b8a270dd4e09`
          **Compare:** https://github.com/luizerico/baseapp/compare/base_platform...fix/issue-7

          No additional implementation required for #13. Closing as completed/superseded by #7.
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 13 --repo luizerico/baseapp --body "$body"
          gh issue close 13 --repo luizerico/baseapp --reason completed
          mkdir -p scripts
          echo '{"issue":13,"state":"closed","supersededBy":7,"branch":"fix/issue-7","sha":"cd6ea41a477aaf8944b7f21ac8b0b8a270dd4e09","outcome":"closed-as-superseded"}' > scripts/close-issue-13-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-13-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Record close of issue #13 (superseded by #7)"
            git push
          fi