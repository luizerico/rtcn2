name: Close issue 27

on:
  push:
    branches:
      - chore/close-issue-27
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment and close #27
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat <<'EOF'
          ## Fixed on `fix/issue-27`

          Client and server no longer duplicate RBAC grant evaluation rules.

          - Canonical pure helpers live in `shared/rbacEvaluate.js` (`isClassWide`, `collectGrantedActions`, `actionIsAllowed`, `parsePermissionString`)
          - API (`api/constants/rbac.js`, `api/services/rbacService.js`) and client (`client/lib/access.ts`) both use that module
          - Mongo loading / admin-group checks stay server-only
          - Added `__tests__/rbacEvaluate.test.js`; existing `access` tests still pass

          Commit: 18c23f8f0511182a4d5ba5d8d3848f2ef57edec7
          EOF
          )"
          body="$(printf '%s\n' "$body" | sed 's/^          //')"
          gh issue comment 27 --repo luizerico/baseapp --body "$body"
          gh issue close 27 --repo luizerico/baseapp --reason completed
          mkdir -p scripts
          echo '{"issue":27,"state":"closed","branch":"fix/issue-27","sha":"18c23f8f0511182a4d5ba5d8d3848f2ef57edec7"}' > scripts/close-issue-27-result.json

      - name: Commit close result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts
          git add scripts/close-issue-27-result.json
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            git commit -m "Record close of issue #27"
            git push
          fi
