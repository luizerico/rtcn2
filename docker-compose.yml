services:
  mongodb:
    image: mongo:7.0
    container_name: projects_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-rootpassword}
    ports:
      - "${MONGO_HOST_PORT:-27178}:27017"
    volumes:
      - projects_mongodb_data:/data/db
    networks:
      - projects_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20.19-alpine
    container_name: projects_app
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TRUST_PROXY: "1"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASS:-rootpassword}@mongodb:27017/${DB_NAME:-projects}?authSource=admin
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASS:-rootpassword}@mongodb:27017/${DB_NAME:-projects}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRE: ${JWT_EXPIRE:-1h}
      DB_NAME: ${DB_NAME:-projects}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      NEXT_PUBLIC_API_BASE_URL: /api
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      # Always use the Compose service DNS name (do not inherit host .env localhost:8000).
      REPORTS_URL: http://reports:8000
      NEXT_PUBLIC_REPORTS_URL: ${NEXT_PUBLIC_REPORTS_URL:-http://localhost}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-tmp}
      FILE_STORAGE_TMP_DIR: ${FILE_STORAGE_TMP_DIR:-tmp/uploads}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GCS_CLIENT_EMAIL: ${GCS_CLIENT_EMAIL:-}
      GCS_PRIVATE_KEY: ${GCS_PRIVATE_KEY:-}
      RTCNAI_URL: ${RTCNAI_URL:-http://localhost:8008}
      RTCNAI_API_KEY: ${RTCNAI_API_KEY:-}
    volumes:
      - ./:/app
    command: >
      sh -c "
        npm install --include=dev &&
        npm run build &&
        node /app/api/database-init.js &&
        npm start
      "
    depends_on:
      mongodb:
        condition: service_healthy
      reports:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    networks:
      - projects_network

  reports:
    build:
      context: ./reports
      dockerfile: Dockerfile
    container_name: projects_reports
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASS:-rootpassword}@mongodb:27017/${DB_NAME:-projects}?authSource=admin
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASS:-rootpassword}@mongodb:27017/${DB_NAME:-projects}?authSource=admin
      DB_NAME: ${DB_NAME:-projects}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      REQUIRE_AUTH: ${REPORTS_REQUIRE_AUTH:-true}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - projects_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: projects_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - projects_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  projects_network:
    driver: bridge

volumes:
  projects_mongodb_data:
    name: projects-mongodb-data
    driver: local
