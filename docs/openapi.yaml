        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      description: |
        Users with `USER:READ` see all active sessions. Others see only their own.
        Supports pagination, search (`q`), and filters. Response includes `items`
        (alias of `sessions`) plus `pagination` and `sort`.
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [username, clientApp, ipAddress, lastSeenAt, expiresAt, createdAt]
            default: lastSeenAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          schema:
            type: string
          description: Search username, clientApp, ipAddress, or userAgent
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: clientApp
          schema:
            type: string
      responses:
        '200':
          description: Paginated active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                    enum: [all, self]
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
                    description: Compatibility alias of items
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Disconnect a session
      description: Users can disconnect their own sessions. `USER:WRITE` can disconnect any session.
      operationId: disconnectSession
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session disconnected
        '403':
          description: Not allowed to disconnect this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/forgot-password:
    get:
      tags: [Auth]
      summary: Request password reset
      description: |
        Always returns the same 200 message whether or not the email exists (no user enumeration).
        When a matching account exists, a one-time raw token is emailed and only its SHA-256 hash
        is stored on the user document (`resetTokenHash`).
      operationId: forgotPassword
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Generic acknowledgement (email sent only if the account exists)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '400':
          description: Invalid, expired, or missing password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Paginated user list with search, filters, and sort.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
