    post:
      tags: [Auth]
      summary: Change password for the authenticated user
      description: Revokes all of the user's active sessions after a successful change.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
