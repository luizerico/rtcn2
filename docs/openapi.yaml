  /api/permissions/acl:
    get:
      tags: [Permissions]
      summary: Load Windows-style ACL for selected assets
      operationId: getAssetAcl
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: resourceType
          required: true
          schema:
            type: string
            enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY]
        - in: query
          name: allObjects
          schema:
            type: boolean
        - in: query
          name: resourceIds
          schema:
            type: string
          description: Comma-separated asset ids
      responses:
        '200':
          description: ACL entries for the selection
    post:
      tags: [Permissions]
      summary: Apply Windows-style ACL to selected assets (canonical permission write)
      description: >
        Canonical permission-write API used by PermissionModal. Replaces the ACL for
        the selected assets (or class-wide *) with the provided principal entries.
        Delete scope is limited to the selection — either resourceId null/target *
        when allObjects is true, or the listed object ids.
      operationId: applyAssetAcl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyAssetAclRequest'
      responses:
        '200':
          description: ACL applied
        '400':
          description: Validation error

  /api/groups/{groupId}/permissions:
    get:
      tags: [Groups]
      summary: List permissions for a group
      operationId: getGroupPermissions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permission rows for the group
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          description: Unauthorized
        '404':
          description: Group not found
    post:
      tags: [Groups]
      summary: Update group permissions (deprecated)
      description: >
        Deprecated. Use POST /api/permissions/acl instead. This endpoint only
        replaces this group's grants for the selected assets (or class-wide *);
        it does not wipe unrelated instance grants for the same resource type.
        Responses include Deprecation and Link headers pointing at the successor.
      deprecated: true
      operationId: updateGroupPermissions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionsRequest'
      responses:
        '200':
          description: Permissions updated (deprecated path)
          headers:
            Deprecation:
              schema:
                type: string
                example: 'true'
            Link:
              schema:
                type: string
                example: '</api/permissions/acl>; rel="successor-version"'
            Warning:
              schema:
                type: string
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Group not found

