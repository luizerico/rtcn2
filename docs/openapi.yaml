openapi: 3.0.3
info:
  title: Projects RBAC API
  description: |
    REST API for authentication, groups, membership, RBAC policies, and protected assets.

    Import this file into Postman (**Import → File**), Insomnia, Thunder Client, or any OpenAPI 3 tool.
  version: 1.0.0
  contact:
    name: Projects API

servers:
  - url: http://localhost:3000
    description: Local unified Next.js app (UI + API)
  - url: "{baseUrl}"
    description: Custom / cloud deployment
    variables:
      baseUrl:
        default: https://app.example.com

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Groups
  - name: Permissions
  - name: Assets
  - name: Surveys
  - name: Logs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT with `sid` claim. Browsers normally use the httpOnly `rbac_session` cookie instead;
        Bearer remains supported for API clients and the reports proxy.

  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable error code when available
          example: INTERNAL
      required: [message]

    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        isVerified:
          type: boolean
          description: When false, login and session use are rejected (NOT_VERIFIED).
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        groups:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!

    LoginRequest:
      type: object
      required: [password]
      properties:
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'

    ApiError:
      type: object
      description: Standard API error response used by controllers and auth middleware.
      properties:
        message:
          type: string
        code:
          type: string
          enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, NOT_VERIFIED, PASSWORD_CHANGED, CONFIG]
      required: [message, code]

    AuthError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              type: string
              enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, PASSWORD_CHANGED, CONFIG]

    SessionRecord:
      type: object
      properties:
        _id:
          type: string
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
        username:
          type: string
        userAgent:
          type: string
        ipAddress:
          type: string
        clientApp:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    PasswordValue:
      type: string
      format: password
      minLength: 8
      description: Shared password policy — at least 8 characters (register, create, reset, and change).
      example: Password123!

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    AdminChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8

    Group:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: editors
        description:
          type: string
          example: Can edit content

    MemberRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
          description: MongoDB ObjectId of the user to add or remove

    UpdatePermissionsRequest:
      type: object
      description: >
        Deprecated request body for POST /api/groups/{groupId}/permissions.
        Prefer ApplyAssetAclRequest via POST /api/permissions/acl.
      required: [scopes, resourceType]
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [READ, WRITE, CREATE, DELETE, ADMIN]
          example: [READ, WRITE]
        resourceType:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY]
        allObjects:
          type: boolean
          description: When true, grants class-wide (*) access for this group only.
        objects:
          type: array
          description: Required when allObjects is false. Only these asset ids are replaced for this group.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string

    ApplyAssetAclRequest:
      type: object
      description: >
        Canonical permission-write payload. Replaces the full ACL for the selected
        assets (or class-wide *), for every principal in entries.
      required: [resourceType, entries]
      properties:
        resourceType:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY]
        allObjects:
          type: boolean
          description: When true, replaces class-wide (*) ACL rows for this resource type.
        objects:
          type: array
          description: Asset selection when allObjects is false. Delete scope is limited to these ids.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              name:
                type: string
        entries:
          type: array
          items:
            type: object
            properties:
              principalType:
                type: string
                enum: [USER, GROUP]
              principalId:
                type: string
              scopes:
                type: array
                items:
                  type: string
                  enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    Permission:
      type: object
      properties:
        _id:
          type: string
        groupId:
          type: string
        resourceType:
          type: string
          enum: [USER, GROUP, ASSET, DOCUMENT, DASHBOARD, DATASET, SURVEY]
        resourceId:
          type: string
          nullable: true
        target:
          type: string
        permission:
          type: string
          enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    AssetResource:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        kind:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY]
        assetType:
          type: string
          enum: [Document, Dashboard, Dataset, Survey]
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Billing Doc
        description:
          type: string
        kind:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET]
          default: DOCUMENT

    SurveyQuestion:
      type: object
      required: [prompt, type]
      properties:
        questionId:
          type: string
        prompt:
          type: string
        type:
          type: string
          enum: [text, multiple_choice, yes_no]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
          default: true

    CreateSurveyRequest:
      type: object
      required: [name, questions]
      properties:
        name:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'

    SubmitSurveyResponseRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId:
                type: string
              value:
                description: Text, Yes/No, or multiple-choice option

    ActionLog:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          nullable: true
        username:
          type: string
        action:
          type: string
          example: auth.login
        resourceType:
          type: string
          example: AUTH
        resourceId:
          type: string
          nullable: true
        method:
          type: string
          example: POST
        path:
          type: string
          example: /api/auth/login
        statusCode:
          type: integer
          example: 200
        success:
          type: boolean
        message:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        clientApp:
          type: string
        meta:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasPrev:
          type: boolean
        hasNext:
          type: boolean

    ListSortMeta:
      type: object
      properties:
        field:
          type: string
        order:
          type: string
          enum: [asc, desc]

    ActionLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionLog'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: |
        Creates an unverified account (`isVerified: false`). Sends a verification email
        to the registered address. The user cannot sign in until they verify via the email
        link or an administrator sets `isVerified` to true.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered (unverified; cannot sign in yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation or duplicate user error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address
      description: Marks the user verified when the emailed token is valid and not expired.
      operationId: verifyEmail
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token

  /api/auth/google/status:
    get:
      tags: [Auth]
      summary: Whether Google OAuth is configured
      operationId: googleAuthStatus
      responses:
        '200':
          description: Configuration flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth
      description: Redirects to Google. Requires GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
      operationId: startGoogleAuth
      responses:
        '302':
          description: Redirect to Google
        '503':
          description: Google OAuth not configured

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      operationId: googleAuthCallback
      responses:
        '302':
          description: Redirect to app home or login with reason

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and create a DB-backed session JWT
      description: |
        Creates a MongoDB session document (shared auth store) and returns a JWT whose `sid`
        claim matches the session. Other apps can validate the same token via `/api/auth/validate`
        or by reading the `sessions` collection.

        Browsers also receive an httpOnly `rbac_session` cookie (SameSite=Lax). The SPA should
        call APIs with `credentials: include` and does not need to store the JWT in localStorage.
        The JSON `token` field remains for API clients (Postman, scripts).

        Login requires `user.isVerified === true`. Self-registered users default to unverified
        until they complete email verification or an administrator sets `isVerified`
        (for example via `PUT /api/users/{id}`).
        Admin-created users, Google sign-in (verified Google email), and the bootstrap admin
        are verified automatically.
        Successful login updates `lastLoginAt`.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful (also sets httpOnly session cookie)
          headers:
            Set-Cookie:
              description: httpOnly session cookie (`rbac_session`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account exists but is not verified (`NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke the current session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user, session, and effective permissions
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile
        '401':
          description: Session missing, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/validate:
    get:
      tags: [Auth]
      summary: Validate bearer session for shared authentication
      operationId: validateSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session is valid
        '401':
          description: Session invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for the authenticated user
      description: Revokes all of the user's active sessions after a successful change.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      description: |
        Users with `USER:READ` see all active sessions. Others see only their own.
        Supports pagination, search (`q`), and filters. Response includes `items`
        (alias of `sessions`) plus `pagination` and `sort`.
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [username, clientApp, ipAddress, lastSeenAt, expiresAt, createdAt]
            default: lastSeenAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          schema:
            type: string
          description: Search username, clientApp, ipAddress, or userAgent
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: clientApp
          schema:
            type: string
      responses:
        '200':
          description: Paginated active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                    enum: [all, self]
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
                    description: Compatibility alias of items
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Disconnect a session
      description: Users can disconnect their own sessions. `USER:WRITE` can disconnect any session.
      operationId: disconnectSession
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session disconnected
        '403':
          description: Not allowed to disconnect this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/forgot-password:
    get:
      tags: [Auth]
      summary: Request password reset
      description: |
        Always returns the same 200 message whether or not the email exists (no user enumeration).
        When a matching account exists, a one-time raw token is emailed and only its SHA-256 hash
        is stored on the user document (`resetTokenHash`).
      operationId: forgotPassword
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Generic acknowledgement (email sent only if the account exists)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '400':
          description: Invalid, expired, or missing password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Paginated user list with search, filters, and sort.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [username, email, createdAt, lastLoginAt, isVerified]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          schema:
            type: string
          description: Search username or email
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: isVerified
          schema:
            type: boolean
        - in: query
          name: groupId
          schema:
            type: string
          description: Only users who are members of this group
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Unauthorized
    post:
      tags: [Users]
      summary: Create user
      description: |
        Admin-provisioned users are created with `isVerified: true` so they can sign in immediately.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created (verified)
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Users]
      summary: Update user
      description: |
        Whitelisted fields only: `username`, `email`, `isVerified`.
        Setting `isVerified` is how admins grant or revoke sign-in for self-registered accounts.
        Password, roleId, and reset tokens cannot be set here.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                isVerified:
                  type: boolean
      responses:
        '200':
          description: User updated
        '400':
          description: No allowed fields or invalid isVerified type
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/users/{id}/password:
    post:
      tags: [Users]
      summary: Admin reset of another user's password
