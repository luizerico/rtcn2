openapi: 3.0.3
info:
  title: Projects RBAC API
  description: |
    REST API for authentication, groups, membership, RBAC policies, and protected assets.

    Import this file into Postman (**Import → File**), Insomnia, Thunder Client, or any OpenAPI 3 tool.
  version: 1.0.0
  contact:
    name: Projects API

servers:
  - url: http://localhost:3000
    description: Local unified Next.js app (UI + API)
  - url: "{baseUrl}"
    description: Custom / cloud deployment
    variables:
      baseUrl:
        default: https://app.example.com

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Groups
  - name: Permissions
  - name: Assets
  - name: Surveys
  - name: Logs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable error code when available
          example: INTERNAL
      required: [message]

    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        isVerified:
          type: boolean
          description: When false, login and session use are rejected (NOT_VERIFIED).

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!

    LoginRequest:
      type: object
      required: [password]
      properties:
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'

    AuthError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, NOT_VERIFIED, PASSWORD_CHANGED, CONFIG]
      required: [message, code]

    SessionRecord:
      type: object
      properties:
        _id:
          type: string
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
        username:
          type: string
        userAgent:
          type: string
        ipAddress:
          type: string
        clientApp:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    PasswordValue:
      type: string
      format: password
      minLength: 8
      description: Shared password policy — at least 8 characters (register, create, reset, and change).
      example: Password123!

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    AdminChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8

    Group:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: editors
        description:
          type: string
          example: Can edit content

    MemberRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
          description: MongoDB ObjectId of the user to add or remove

    UpdatePermissionsRequest:
      type: object
      required: [scopes, target]
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [READ, WRITE, DELETE, ADMIN]
          example: [READ, WRITE]
        target:
          type: string
          example: User
        resourceType:
          type: string
          enum: [USER, GROUP, ASSET, DOCUMENT, DASHBOARD, DATASET, SURVEY, SURVEY_RESPONSE]
          default: ASSET

    Permission:
      type: object
      properties:
        _id:
          type: string
        groupId:
          type: string
        resourceType:
          type: string
          enum: [USER, GROUP, ASSET, DOCUMENT, DASHBOARD, DATASET, SURVEY, SURVEY_RESPONSE]
        resourceId:
          type: string
          nullable: true
        target:
          type: string
        permission:
          type: string
          enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    AssetResource:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        kind:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY, SURVEY_RESPONSE]
        assetType:
          type: string
          enum: [Asset, Survey, SurveyResponse]
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Billing Doc
        description:
          type: string
        kind:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET]
          default: DOCUMENT

    SurveyQuestion:
      type: object
      required: [prompt, type]
      properties:
        questionId:
          type: string
        prompt:
          type: string
        type:
          type: string
          enum: [text, multiple_choice, yes_no]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
          default: true

    CreateSurveyRequest:
      type: object
      required: [name, questions]
      properties:
        name:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'

    SubmitSurveyResponseRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId:
                type: string
              value:
                description: Text, Yes/No, or multiple-choice option

    ActionLog:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          nullable: true
        username:
          type: string
        action:
          type: string
          example: auth.login
        resourceType:
          type: string
          example: AUTH
        resourceId:
          type: string
          nullable: true
        method:
          type: string
          example: POST
        path:
          type: string
          example: /api/auth/login
        statusCode:
          type: integer
          example: 200
        success:
          type: boolean
        message:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        clientApp:
          type: string
        meta:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ActionLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionLog'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasPrev:
              type: boolean
            hasNext:
              type: boolean
        sort:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
              enum: [asc, desc]

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: |
        Creates an unverified account (`isVerified: false`). The user cannot sign in until an
        administrator sets `isVerified` to true.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered (unverified; cannot sign in yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation or duplicate user error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and create a DB-backed session JWT
      description: |
        Creates a MongoDB session document (shared auth store) and returns a JWT whose `sid`
        claim matches the session. Other apps can validate the same token via `/api/auth/validate`
        or by reading the `sessions` collection.

        Login requires `user.isVerified === true`. Self-registered users default to unverified
        until an administrator sets `isVerified` (for example via `PUT /api/users/{id}`).
        Admin-created users and the bootstrap admin are verified automatically.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account exists but is not verified (`NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke the current session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user, session, and effective permissions
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile
        '401':
          description: Session missing, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/validate:
    get:
      tags: [Auth]
      summary: Validate bearer session for shared authentication
      operationId: validateSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session is valid
        '401':
          description: Session invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for the authenticated user
      description: Revokes all of the user's active sessions after a successful change.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      description: |
        Users with `USER:READ` see all active sessions. Others see only their own.
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                    enum: [all, self]
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Disconnect a session
      description: Users can disconnect their own sessions. `USER:WRITE` can disconnect any session.
      operationId: disconnectSession
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session disconnected
        '403':
          description: Not allowed to disconnect this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/forgot-password:
    get:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Reset email sent (token is delivered via the configured email sender only)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Missing email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '400':
          description: Invalid, expired, or missing password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
        '401':
          description: Unauthorized
    post:
      tags: [Users]
      summary: Create user
      description: |
        Admin-provisioned users are created with `isVerified: true` so they can sign in immediately.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created (verified)
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Users]
      summary: Update user
      description: |
        Whitelisted fields only: `username`, `email`, `isVerified`.
        Setting `isVerified` is how admins grant or revoke sign-in for self-registered accounts.
        Password, roleId, and reset tokens cannot be set here.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                isVerified:
                  type: boolean
      responses:
        '200':
          description: User updated
        '400':
          description: No allowed fields or invalid isVerified type
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/users/{id}/password:
    post:
      tags: [Users]
      summary: Admin reset of another user's password
      description: Requires `USER:WRITE`. Revokes all of the target user's sessions.
      operationId: adminChangeUserPassword
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found

  /api/groups:
    get:
      tags: [Groups]
      summary: List groups
      operationId: listGroups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    post:
      tags: [Groups]
      summary: Create group
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/groups/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Groups]
      summary: Update group
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [Groups]
      summary: Delete group
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/groups/{groupId}/members:
    post:
      tags: [Groups]
      summary: Add member to group
      operationId: addGroupMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
      responses:
        '200':
          description: Member added
        '400':
          description: Missing target user
        '401':
          description: Unauthorized
        '404':
          description: Group or user not found
    delete:
      tags: [Groups]
      summary: Remove member from group
      operationId: removeGroupMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
      responses:
        '200':
          description: Member removed
        '400':
          description: Missing target user
        '401':
          description: Unauthorized
        '404':
          description: Group not found

  /api/permissions:
    get:
      tags: [Permissions]
      summary: List all permissions with principal names
      operationId: listPermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All permission rows for management screens
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Permission'
                    - type: object
                      properties:
                        principalType:
                          type: string
                          enum: [USER, GROUP]
                        principalId:
                          type: string
                        principalName:
                          type: string
                        groupName:
                          type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/permissions/catalog:
    get:
      tags: [Permissions]
      summary: Catalog of asset classes and USER/GROUP principals
      operationId: getPermissionCatalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Asset classes (only) plus users and groups for ACL editing

  /api/permissions/acl:
    get:
      tags: [Permissions]
      summary: Load Windows-style ACL for selected assets
      operationId: getAssetAcl
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: resourceType
          required: true
          schema:
            type: string
            enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY, SURVEY_RESPONSE]
        - in: query
          name: allObjects
          schema:
            type: boolean
        - in: query
          name: resourceIds
          schema:
            type: string
          description: Comma-separated asset ids
      responses:
        '200':
          description: ACL entries for the selection
    post:
      tags: [Permissions]
      summary: Apply Windows-style ACL to selected assets
      operationId: applyAssetAcl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, entries]
              properties:
                resourceType:
                  type: string
                  enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY, SURVEY_RESPONSE]
                allObjects:
                  type: boolean
                objects:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      label:
                        type: string
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      principalType:
                        type: string
                        enum: [USER, GROUP]
                      principalId:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
                          enum: [READ, WRITE, CREATE, DELETE, ADMIN]
      responses:
        '200':
          description: ACL applied
        '400':
          description: Validation error

