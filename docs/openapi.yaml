      operationId: getPermissionCatalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Asset classes (only) plus users and groups for ACL editing

  /api/permissions/acl:
    get:
      tags: [Permissions]
      summary: Load Windows-style ACL for selected assets
      description: >
        Prefer POST /api/permissions/acl/query when the selection is large (for example
        every county in a region). Query-string `resourceIds` can exceed HTTP URL limits (431).
      operationId: getAssetAcl
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: resourceType
          required: true
          schema:
            type: string
            enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT, COUNTY]
        - in: query
          name: allObjects
          schema:
            type: boolean
        - in: query
          name: resourceIds
          schema:
            type: string
          description: Comma-separated asset ids. Avoid for large COUNTY selections; use POST /acl/query.
      responses:
        '200':
          description: ACL entries for the selection
    post:
      tags: [Permissions]
      summary: Apply Windows-style ACL to selected assets (canonical permission write)
      description: >
        Canonical permission-write API used by PermissionModal. Replaces the ACL for
        the selected assets (or class-wide *) with the provided principal entries.
        Delete scope is limited to the selection — either resourceId null/target *
        when allObjects is true, or the listed object ids.
      operationId: applyAssetAcl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyAssetAclRequest'
      responses:
        '200':
          description: ACL applied
        '400':
          description: Validation error

  /api/permissions/acl/delete:
    post:
      tags: [Permissions]
      summary: Delete ACL rows for selected assets
      description: >
        Removes permission documents for a class-wide * grant or for the listed
        resource ids. Does not insert replacement rows.
      operationId: deleteAssetAcl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAssetAclRequest'
      responses:
        '200':
          description: Permissions deleted
        '400':
          description: Validation error
        '403':
          description: Forbidden

  /api/permissions/acl/query:
    post:
      tags: [Permissions]
      summary: Load Windows-style ACL for a large asset selection
      description: Same as GET /api/permissions/acl, with resource ids in the JSON body.
      operationId: queryAssetAcl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryAssetAclRequest'
