          name: groupId
          schema:
            type: string
          description: Only users who are members of this group
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Unauthorized
    post:
      tags: [Users]
      summary: Create user
      description: |
        Admin-provisioned users are created with `isVerified: true` so they can sign in immediately.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created (verified)
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Users]
      summary: Update user
      description: |
        Whitelisted fields only: `username`, `email`, `isVerified`.
        Setting `isVerified` is how admins grant or revoke sign-in for self-registered accounts.
        Password, roleId, and reset tokens cannot be set here.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                isVerified:
                  type: boolean
      responses:
        '200':
          description: User updated
        '400':
          description: No allowed fields or invalid isVerified type
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

