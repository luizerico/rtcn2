            type: string
            enum: [username, email, createdAt, lastLoginAt, isVerified]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          schema:
            type: string
          description: Search username or email
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: isVerified
          schema:
            type: boolean
