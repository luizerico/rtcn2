          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
            example: auth.login
        - in: query
          name: resourceType
          schema:
            type: string
            example: USER
        - in: query
          name: resourceId
          schema:
            type: string
        - in: query
          name: method
          schema:
            type: string
            enum: [POST, PUT, PATCH, DELETE]
        - in: query
          name: statusCode
          schema:
            type: integer
        - in: query
          name: success
          schema:
            type: boolean
        - in: query
          name: clientApp
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt, username, action, resourceType, method, statusCode, success]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated action logs
          content:
            application/json:
