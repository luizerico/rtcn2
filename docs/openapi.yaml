      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile
        '401':
          description: Session missing, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/validate:
