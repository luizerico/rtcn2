openapi: 3.0.3
info:
  title: Projects RBAC API
  description: |
    REST API for authentication, groups, membership, RBAC policies, and protected assets.

    Import this file into Postman (**Import → File**), Insomnia, Thunder Client, or any OpenAPI 3 tool.
  version: 1.0.0
  contact:
    name: Projects API

servers:
  - url: http://localhost:3000
    description: Local unified Next.js app (UI + API)
  - url: "{baseUrl}"
    description: Custom / cloud deployment
    variables:
      baseUrl:
        default: https://app.example.com

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Groups
  - name: Permissions
  - name: Assets
  - name: Surveys
  - name: Sponsors
  - name: Opportunities
  - name: Projects
  - name: Logs
  - name: Regions
  - name: States
  - name: Microregions
  - name: Biomes
  - name: Counties
  - name: Malhas
  - name: GeoIndicators

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT with `sid` claim. Browsers normally use the httpOnly `rbac_session` cookie instead;
        Bearer remains supported for API clients and the reports proxy.

  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable error code when available
          example: INTERNAL
      required: [message]

    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        isVerified:
          type: boolean
          description: When false, login and session use are rejected (NOT_VERIFIED).
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        groups:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'

    ApiError:
      type: object
      description: Standard API error response used by controllers and auth middleware.
      properties:
        message:
          type: string
        code:
          type: string
          enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, NOT_VERIFIED, PASSWORD_CHANGED, CONFIG]
      required: [message, code]

    AuthError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              type: string
              enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, PASSWORD_CHANGED, CONFIG]

    SessionRecord:
      type: object
      properties:
        _id:
          type: string
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
        username:
          type: string
        userAgent:
          type: string
        ipAddress:
          type: string
        clientApp:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    PasswordValue:
      type: string
      format: password
      minLength: 8
      description: Shared password policy — at least 8 characters (register, create, reset, and change).
      example: Password123!

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    AdminChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8

    Group:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: editors
        description:
          type: string
          example: Can edit content

    MemberRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
          description: MongoDB ObjectId of the user to add or remove

    UpdatePermissionsRequest:
      type: object
      description: >
        Deprecated request body for POST /api/groups/{groupId}/permissions.
        Prefer ApplyAssetAclRequest via POST /api/permissions/acl.
      required: [scopes, resourceType]
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [READ, WRITE, CREATE, DELETE, ADMIN]
          example: [READ, WRITE]
        resourceType:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY, SPONSOR, OPPORTUNITY, PROJECT]
        allObjects:
          type: boolean
          description: When true, grants class-wide (*) access for this group only.
        objects:
          type: array
          description: Required when allObjects is false. Only these asset ids are replaced for this group.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string

    ApplyAssetAclRequest:
      type: object
      description: >
        Canonical permission-write payload. Replaces the full ACL for the selected
        assets (or class-wide *), for every principal in entries.
      required: [resourceType, entries]
      properties:
        resourceType:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY, SPONSOR, OPPORTUNITY, PROJECT]
        allObjects:
          type: boolean
          description: When true, replaces class-wide (*) ACL rows for this resource type.
        objects:
          type: array
          description: Asset selection when allObjects is false. Delete scope is limited to these ids.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              name:
                type: string
        entries:
          type: array
          items:
            type: object
            properties:
              principalType:
                type: string
                enum: [USER, GROUP]
              principalId:
                type: string
              scopes:
                type: array
                items:
                  type: string
                  enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    Permission:
      type: object
      properties:
        _id:
          type: string
        groupId:
          type: string
        resourceType:
          type: string
          enum: [USER, GROUP, ASSET, DOCUMENT, DASHBOARD, DATASET, SURVEY, SPONSOR, OPPORTUNITY, PROJECT]
        resourceId:
          type: string
          nullable: true
        target:
          type: string
        permission:
          type: string
          enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    AssetResource:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        kind:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET, SURVEY, SPONSOR, OPPORTUNITY, PROJECT]
        assetType:
          type: string
          enum: [Document, Dashboard, Dataset, Survey, Sponsor, Opportunity, Project]
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Billing Doc
        description:
          type: string
        kind:
          type: string
          enum: [DOCUMENT, DASHBOARD, DATASET]
          default: DOCUMENT

    SurveyQuestion:
      type: object
      required: [prompt, type]
      properties:
        questionId:
          type: string
        prompt:
          type: string
        type:
          type: string
          enum: [text, multiple_choice, yes_no]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
          default: true

    CreateSurveyRequest:
      type: object
      required: [name, questions]
      properties:
        name:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'

    SubmitSurveyResponseRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId:
                type: string
              value:
                description: Text, Yes/No, or multiple-choice option

    Sponsor:
      allOf:
        - $ref: '#/components/schemas/AssetResource'
        - type: object
          required: [orgEmail, origem, contact, phone]
          properties:
            orgEmail:
              type: string
            origem:
              type: string
              enum:
                - emp_com_fins_lucrativos
                - emp_publica
                - ent_sem_fins_lucrativos
                - fundacoes
                - gov_estadual
                - gov_federal
                - gov_municipal
                - institutos
                - org_internacional
                - pessoa_fisica
                - sociedade_economia_mista
            orgUnit:
              type: string
            webpage:
              type: string
            email:
              type: string
            socialMedia:
              type: string
            contact:
              type: string
            phone:
              type: string
            address:
              type: string
            city:
              type: string
            state:
              type: string
            zipCode:
              type: string
            country:
              type: string
            obs:
              type: string

    CreateSponsorRequest:
      type: object
      required: [name, orgEmail, origem, contact, phone]
      properties:
        name:
          type: string
        orgName:
          type: string
          description: Alias for name
        orgEmail:
          type: string
        origem:
          type: string
        contact:
          type: string
        phone:
          type: string
        description:
          type: string

    Opportunity:
      allOf:
        - $ref: '#/components/schemas/AssetResource'
        - type: object
          required: [sponsor, type, category, eligibility, website, submissionMethod, startDate, budget]
          properties:
            sponsor:
              description: Sponsor id or populated sponsor
            type:
              type: string
              enum: [financial, technical, educational, other]
            category:
              type: string
              enum:
                - call
                - financing
                - award
                - competition
                - scholarship
                - cooperation
                - tax_incentive_law
                - sponsorship
                - donation
                - emergency_transfer
                - financial_incentive
                - transfer_fund_to_fund
                - special_transfers
                - legal_discretionary_transfers
                - partnership_management_transfer
                - special_state_transfer
                - new_pac
                - funds
                - other
            eligibility:
              type: string
              enum:
                - municipal_public_administration
                - state_public_administration
                - public_consortiums
                - nonprofit_entities
                - for_profit_companies
                - icts_heis
                - startups
                - s_system
                - other
            website:
              type: string
            submissionMethod:
              type: string
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
              nullable: true
            continuous:
              type: boolean
            budget:
              type: number
            totalBudget:
              type: number
              nullable: true
            currency:
              type: string
              example: R$ BRL
            obs:
              type: array
              items:
                type: string
            documents:
              type: array
              items:
                type: string
            areas:
              type: array
              items:
                type: string
              description: Optional Question ids (catalog not implemented)

    CreateOpportunityRequest:
      type: object
      required: [name, description, sponsor, type, category, eligibility, website, submissionMethod, startDate, budget]
      properties:
        name:
          type: string
        description:
          type: string
        sponsor:
          type: string
        type:
          type: string
        category:
          type: string
        eligibility:
          type: string
        website:
          type: string
        submissionMethod:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        continuous:
          type: boolean
        budget:
          type: number
        totalBudget:
          type: number
        currency:
          type: string

    Project:
      allOf:
        - $ref: '#/components/schemas/AssetResource'
        - type: object
          required: [projWebsite, projStartDate, projBudget, projStatus]
          properties:
            opportunity:
              nullable: true
            relatedEntity:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [county, state, biome, region, microregion]
                entityId:
                  type: array
                  items:
                    type: string
            relatedEntities:
              type: array
              items:
                type: object
            projWebsite:
              type: string
            projStartDate:
              type: string
              format: date-time
            projEndDate:
              type: string
              format: date-time
              nullable: true
            projBudget:
              type: number
            currency:
              type: string
            projStatus:
              type: string
            projComments:
              type: array
              items:
                type: string
            projDocuments:
              type: array
              items:
                type: string
            obs:
              type: string
            areas:
              type: array
              items:
                type: string

    CreateProjectRequest:
      type: object
      required: [name, description, projWebsite, projStartDate, projBudget, projStatus]
      properties:
        name:
          type: string
        projName:
          type: string
          description: Alias for name
        description:
          type: string
        opportunity:
          type: string
          nullable: true
        relatedEntity:
          type: object
        projWebsite:
          type: string
        projStartDate:
          type: string
          format: date-time
        projEndDate:
          type: string
          format: date-time
        projBudget:
          type: number
        currency:
          type: string
        projStatus:
          type: string

    ActionLog:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          nullable: true
        username:
          type: string
        action:
          type: string
          example: auth.login
        resourceType:
          type: string
          example: AUTH
        resourceId:
          type: string
          nullable: true
        method:
          type: string
          example: POST
        path:
          type: string
          example: /api/auth/login
        statusCode:
          type: integer
          example: 200
        success:
          type: boolean
        message:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        clientApp:
          type: string
        meta:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasPrev:
          type: boolean
        hasNext:
          type: boolean

    ListSortMeta:
      type: object
      properties:
        field:
          type: string
        order:
          type: string
          enum: [asc, desc]

    ActionLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionLog'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    GeoRef:
      type: object
      description: Populated parent geography document (code + name).
      properties:
        _id:
          type: string
        code:
          type: string
        name:
          type: string

    Region:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
          example: NE
        name:
          type: string
          example: Nordeste
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    State:
      allOf:
        - $ref: '#/components/schemas/Region'
        - type: object
          properties:
            region:
              oneOf:
                - type: string
                - $ref: '#/components/schemas/GeoRef'

    Microregion:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
          nullable: true
          example: BA01
        name:
          type: string
          example: Salvador
        region:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/GeoRef'
        state:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/GeoRef'
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    StateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/State'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    MicroregionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Microregion'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    Biome:
      $ref: '#/components/schemas/Region'

    BiomeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Biome'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    YearlyValue:
      type: object
      properties:
        value:
          type: number
        year:
          type: integer

    EndangeredPeople:
      type: object
      properties:
        value:
          type: number
        year:
          type: integer
        riskType:
          type: string

    CountyStatus:
      type: object
      properties:
        endangeredPeople:
          type: array
          items:
            $ref: '#/components/schemas/EndangeredPeople'
        disasterRate:
          type: array
          items:
            $ref: '#/components/schemas/YearlyValue'
        hidroRisk:
          type: array
          items:
            $ref: '#/components/schemas/YearlyValue'

    County:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        code:
          type: string
        IBGECode:
          type: string
        population:
          type: number
        region:
          $ref: '#/components/schemas/GeoRef'
        state:
          $ref: '#/components/schemas/GeoRef'
        microregion:
          $ref: '#/components/schemas/GeoRef'
        biome:
          $ref: '#/components/schemas/GeoRef'
        status:
          $ref: '#/components/schemas/CountyStatus'

    CountyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/County'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    CountyEmission:
      type: object
      properties:
        _id:
          type: string
        county:
          type: string
        actionType:
          type: string
        gasType:
          type: string
        value:
          type: number
        year:
          type: integer
        sector:
          type: string
        category:
          type: string
        subCategory:
          type: string
        product:
          type: string
        detail:
          type: string
        activity:
          type: string

    CountyEmissionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CountyEmission'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: |
        Creates an unverified account (`isVerified: false`). Sends a verification email
        to the registered address. The user cannot sign in until they verify via the email
        link or an administrator sets `isVerified` to true.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered (unverified; cannot sign in yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation or duplicate user error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address
      description: Marks the user verified when the emailed token is valid and not expired.
      operationId: verifyEmail
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token

  /api/auth/google/status:
    get:
      tags: [Auth]
      summary: Whether Google OAuth is configured
      operationId: googleAuthStatus
      responses:
        '200':
          description: Configuration flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth
      description: Redirects to Google. Requires GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
      operationId: startGoogleAuth
      responses:
        '302':
          description: Redirect to Google
        '503':
          description: Google OAuth not configured

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      operationId: googleAuthCallback
      responses:
        '302':
          description: Redirect to app home or login with reason

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and create a DB-backed session JWT
      description: |
        Creates a MongoDB session document (shared auth store) and returns a JWT whose `sid`
        claim matches the session. Other apps can validate the same token via `/api/auth/validate`
        or by reading the `sessions` collection.

        Browsers also receive an httpOnly `rbac_session` cookie (SameSite=Lax). The SPA should
        call APIs with `credentials: include` and does not need to store the JWT in localStorage.
        The JSON `token` field remains for API clients (Postman, scripts).

        Authenticate with the registered `email` and `password` (username is not accepted).
        Login requires `user.isVerified === true`. Self-registered users default to unverified
        until they complete email verification or an administrator sets `isVerified`
        (for example via `PUT /api/users/{id}`).
        Admin-created users, Google sign-in (verified Google email), and the bootstrap admin
        are verified automatically.
        Successful login updates `lastLoginAt`.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful (also sets httpOnly session cookie)
          headers:
            Set-Cookie:
              description: httpOnly session cookie (`rbac_session`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account exists but is not verified (`NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/logout:
    post:
      tags: [Auth]
