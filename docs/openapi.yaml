openapi: 3.0.3
info:
  title: Projects RBAC API
  description: |
    REST API for authentication, groups, membership, RBAC policies, and protected assets.

    Import this file into Postman (**Import → File**), Insomnia, Thunder Client, or any OpenAPI 3 tool.
  version: 1.0.0
  contact:
    name: Projects API

servers:
  - url: http://localhost:3000
    description: Local unified Next.js app (UI + API)
  - url: "{baseUrl}"
    description: Custom / cloud deployment
    variables:
      baseUrl:
        default: https://app.example.com

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Groups
  - name: Organizations
  - name: Permissions
  - name: Assets
  - name: Surveys
  - name: Local plans
  - name: Sponsors
  - name: Opportunities
  - name: Files
  - name: Recycle bin
  - name: Projects
  - name: Logs
  - name: Regions
  - name: States
  - name: Microregions
  - name: Biomes
  - name: Counties
  - name: Malhas
  - name: GeoIndicators

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT with `sid` claim. Browsers normally use the httpOnly `rbac_session` cookie instead;
        Bearer remains supported for API clients and the reports proxy.

  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable error code when available
          example: INTERNAL
      required: [message]

    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        isVerified:
          type: boolean
          description: When false, login and session use are rejected (NOT_VERIFIED).
        isEnabled:
          type: boolean
          description: When false, login and session use are rejected (ACCOUNT_DISABLED).
        language:
          type: string
          nullable: true
        organization:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        groups:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'

    ApiError:
      type: object
      description: Standard API error response used by controllers and auth middleware.
      properties:
        message:
          type: string
        code:
          type: string
          enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, NOT_VERIFIED, ACCOUNT_DISABLED, PASSWORD_CHANGED, CONFIG]
      required: [message, code]

    AuthError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              type: string
              enum: [NO_TOKEN, EXPIRED, REVOKED, INVALID, USER_NOT_FOUND, FORBIDDEN, INVALID_CREDENTIALS, PASSWORD_CHANGED, ACCOUNT_DISABLED, CONFIG]

    SessionRecord:
      type: object
      properties:
        _id:
          type: string
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
        username:
          type: string
        userAgent:
          type: string
        ipAddress:
          type: string
        clientApp:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    PasswordValue:
      type: string
      format: password
      minLength: 8
      description: Shared password policy — at least 8 characters (register, create, reset, and change).
      example: Password123!

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    AdminChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          $ref: '#/components/schemas/PasswordValue'

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8

    Group:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: editors
        description:
          type: string
          example: Can edit content

    Organization:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        website:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: SEBRAE MS
        description:
          type: string
          maxLength: 500
        website:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    MemberRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
          description: MongoDB ObjectId of the user to add or remove

    UpdatePermissionsRequest:
      type: object
      description: >
        Deprecated request body for POST /api/groups/{groupId}/permissions.
        Prefer ApplyAssetAclRequest via POST /api/permissions/acl.
      required: [scopes, resourceType]
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [READ, WRITE, CREATE, DELETE, ADMIN]
          example: [READ, WRITE]
        resourceType:
          type: string
          enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT, COUNTY]
        allObjects:
          type: boolean
          description: When true, grants class-wide (*) access for this group only.
        objects:
          type: array
          description: Required when allObjects is false. Only these asset ids are replaced for this group.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string

    QueryAssetAclRequest:
      type: object
      required: [resourceType]
      properties:
        resourceType:
          type: string
          enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT, COUNTY]
        allObjects:
          type: boolean
        resourceIds:
          type: array
          description: Asset ids when allObjects is false. Sent in the body so large county selections do not overflow the URL.
          items:
            type: string

    DeleteAssetAclRequest:
      type: object
      required: [resourceType]
      properties:
        resourceType:
          type: string
          enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT, COUNTY]
        allObjects:
          type: boolean
          description: When true, deletes class-wide (*) ACL rows for this resource type.
        resourceIds:
          type: array
          description: Asset ids when allObjects is false.
          items:
            type: string

    ApplyAssetAclRequest:
      type: object
      description: >
        Canonical permission-write payload. Replaces the full ACL for the selected
        assets (or class-wide *), for every principal in entries.
      required: [resourceType, entries]
      properties:
        resourceType:
          type: string
          enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT, COUNTY]
        allObjects:
          type: boolean
          description: When true, replaces class-wide (*) ACL rows for this resource type.
        objects:
          type: array
          description: Asset selection when allObjects is false. Delete scope is limited to these ids.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              name:
                type: string
        entries:
          type: array
          items:
            type: object
            properties:
              principalType:
                type: string
                enum: [USER, GROUP]
              principalId:
                type: string
              scopes:
                type: array
                items:
                  type: string
                  enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    Permission:
      type: object
      properties:
        _id:
          type: string
        groupId:
          type: string
        resourceType:
          type: string
          enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT, COUNTY]
        resourceId:
          type: string
          nullable: true
        target:
          type: string
        permission:
          type: string
          enum: [READ, WRITE, CREATE, DELETE, ADMIN]

    AssetResource:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        kind:
          type: string
          enum: [SURVEY, SPONSOR, OPPORTUNITY, PROJECT]
        assetType:
          type: string
          enum: [Survey, Sponsor, Opportunity, Project]
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      description: >
        Generic asset create is retired. POST /api/assets rejects all kinds;
        use the dedicated surveys, sponsors, opportunities, or projects APIs.
      required: [name]
      properties:
        name:
          type: string
          example: Policy Survey
        description:
          type: string
        kind:
          type: string
          description: Any kind is rejected. Dedicated types return a pointer to their API.

    SurveyQuestion:
      type: object
      required: [prompt, type]
      properties:
        _id:
          type: string
          description: Preserved question ObjectId. Omit on create to mint a new id.
        questionId:
          type: string
        code:
          type: string
        area:
          type: string
        prompt:
          type: string
        type:
          type: string
          enum: [score, text, multiple_choice, yes_no]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
          default: true
        evidence:
          type: string
        criteria:
          type: string
        maxPoints:
          type: number
        weight:
          type: number
        todo:
          type: string
        revision:
          type: integer
          minimum: 1
        questionRevision:
          type: integer
          minimum: 1

    CreateSurveyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        instrumentType:
          type: string
          enum: [poll, scored_diagnostic]
          default: poll
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'
        countyIds:
          type: array
          items:
            type: string
          description: Counties that may open sheets for this instrument. Empty means no county sheets.

    SetSurveyActiveVersionRequest:
      type: object
      properties:
        versionId:
          type: string
          description: Instrument version id to use for new answers.
        version:
          type: integer
          minimum: 1
          description: Published version number. Used when versionId is omitted.
      description: Provide versionId or version. Existing sheets keep the version they were started on.

    InstrumentVersionSummary:
      type: object
      properties:
        _id:
          type: string
        version:
          type: integer
        publishedAt:
          type: string
          format: date-time
        active:
          type: boolean
          description: True when this snapshot is used for new answers.

    AssignSurveyCountiesRequest:
      type: object
      required: [countyIds]
      properties:
        countyIds:
          type: array
          items:
            type: string
          description: Counties that may open sheets. Saving this list does not publish a new version.
        versionId:
          type: string
          description: Published version for newly added counties. Existing assignments keep their version.

    BulkSurveyCountiesRequest:
      type: object
      required: [action, geoType, geoId]
      properties:
        action:
          type: string
          enum: [assign, unassign]
        geoType:
          type: string
          enum: [region, state, biome, microregion, county]
        geoId:
          type: string
          description: Region, state, biome, microregion, or county id. Server resolves matching county ids.
        countyIds:
          type: array
          items:
            type: string
          description: >
            Optional on bulk confirm. When present, only these ids that also belong to the
            resolved geography are assigned or unassigned. Extra ids outside that set are
            ignored. Omitted means apply every county in the geography. Preview ignores this field.
        versionId:
          type: string
          description: On assign, published version for newly added counties. Ignored on unassign.

    BulkSurveyCountiesPreviewResponse:
      type: object
      properties:
        action:
          type: string
          enum: [assign, unassign]
        geoType:
          type: string
          enum: [region, state, biome, microregion, county]
        geoId:
          type: string
        counties:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
              IBGECode:
                type: string
              code:
                type: string
        addCount:
          type: integer
          description: Counties that would be added (assign preview).
        removeCount:
          type: integer
          description: Counties that would be removed (unassign preview).

    SubmitSurveyResponseRequest:
      type: object
      required: [answers]
      properties:
        subjectType:
          type: string
          enum: [COUNTY, PROJECT, OPPORTUNITY, SPONSOR]
        subjectId:
          type: string
        status:
          type: string
          enum: [in_progress, pending, need_changes, approved, archived]
        partial:
          type: boolean
        answers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId:
                type: string
              value:
                description: Number for score items; text or option for poll types
              obs:
                type: string
              evidenceFileId:
                type: string

    Sponsor:
      allOf:
        - $ref: '#/components/schemas/AssetResource'
        - type: object
          required: [orgEmail, origem, contact, phone]
          properties:
            orgEmail:
              type: string
            origem:
              type: string
              enum:
                - emp_com_fins_lucrativos
                - emp_publica
                - ent_sem_fins_lucrativos
                - fundacoes
                - gov_estadual
                - gov_federal
                - gov_municipal
                - institutos
                - org_internacional
                - pessoa_fisica
                - sociedade_economia_mista
            orgUnit:
              type: string
            webpage:
              type: string
            email:
              type: string
            socialMedia:
              type: string
            contact:
              type: string
            phone:
              type: string
            address:
              type: string
            city:
              type: string
            state:
              type: string
            zipCode:
              type: string
            country:
              type: string
            obs:
              type: string

    CreateSponsorRequest:
      type: object
      required: [name, orgEmail, origem, contact, phone]
      properties:
        name:
          type: string
        orgName:
          type: string
          description: Alias for name
        orgEmail:
          type: string
        origem:
          type: string
        contact:
          type: string
        phone:
          type: string
        description:
          type: string

    Opportunity:
      allOf:
        - $ref: '#/components/schemas/AssetResource'
        - type: object
          required: [sponsor, type, category, eligibility, website, submissionMethod, startDate, budget]
          properties:
            sponsor:
              description: Sponsor id or populated sponsor
            type:
              type: string
              enum: [financial, technical, educational, other]
            category:
              type: string
              enum:
                - call
                - financing
                - award
                - competition
                - scholarship
                - cooperation
                - tax_incentive_law
                - sponsorship
                - donation
                - emergency_transfer
                - financial_incentive
                - transfer_fund_to_fund
                - special_transfers
                - legal_discretionary_transfers
                - partnership_management_transfer
                - special_state_transfer
                - new_pac
                - funds
                - other
            eligibility:
              type: string
              enum:
                - municipal_public_administration
                - state_public_administration
                - public_consortiums
                - nonprofit_entities
                - for_profit_companies
                - icts_heis
                - startups
                - s_system
                - other
            website:
              type: string
            submissionMethod:
              type: string
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
              nullable: true
            continuous:
              type: boolean
            budget:
              type: number
            totalBudget:
              type: number
              nullable: true
            currency:
              type: string
              example: R$ BRL
            obs:
              type: array
              items:
                type: string
            documents:
              type: array
              items:
                type: string
            areas:
              type: array
              items:
                type: string
              description: Optional Question ids (catalog not implemented)

    CreateOpportunityRequest:
      type: object
      required: [name, description, sponsor, type, category, eligibility, website, submissionMethod, startDate, budget]
      properties:
        name:
          type: string
        description:
          type: string
        sponsor:
          type: string
        type:
          type: string
        category:
          type: string
        eligibility:
          type: string
        website:
          type: string
        submissionMethod:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        continuous:
          type: boolean
        budget:
          type: number
        totalBudget:
          type: number
        currency:
          type: string

    StoredFile:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          description: Display name (editable label)
        displayName:
          type: string
        originalName:
          type: string
        storedName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        ownerType:
          type: string
          enum: [opportunity, project, sponsor, instrument_response]
        ownerId:
          type: string
        obs:
          type: string
        questionId:
          type: string
          nullable: true
          description: Survey question id when the file is evidence on an instrument response
        storageDriver:
          type: string
          enum: [tmp, azure, aws, gcs]
        analysis:
          $ref: '#/components/schemas/StoredFileAnalysis'
        uploadedBy:
          type: object
        updatedBy:
          type: object
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        deletedBy:
          type: object
          nullable: true
        ownerLabel:
          type: string
          description: Parent record name captured when the file was moved to the bin
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StoredFileAnalysis:
      type: object
      nullable: true
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        result:
          type: string
          nullable: true
          description: Summary and relevant points from RTCNAI
        error:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        statusSummary:
          type: string
          nullable: true
          description: Latest RTCNAI processing status message
        progressStep:
          type: string
          nullable: true
        progressCompleted:
          type: integer
          nullable: true
        progressTotal:
          type: integer
          nullable: true
        queuePosition:
          type: integer
          nullable: true
          description: Position in the RTCNAI queue while the job is waiting
        requestedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    FileAnalysisJob:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        summary:
          type: string
          nullable: true
        statusSummary:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        progressStep:
          type: string
          nullable: true
        progressCompleted:
          type: integer
          nullable: true
        progressTotal:
          type: integer
          nullable: true
        queuePosition:
          type: integer
          nullable: true
        requestedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        file:
          $ref: '#/components/schemas/StoredFile'

    RecycleBinItem:
      type: object
      required: [itemType, _id, name]
      properties:
        itemType:
          type: string
          enum: [FILE, USER, GROUP, ORGANIZATION, SURVEY, SURVEY_ANSWER, SPONSOR, OPPORTUNITY, PROJECT]
        _id:
          type: string
        name:
          type: string
        detail:
          type: string
        deletedAt:
          type: string
          format: date-time
          nullable: true
        deletedBy:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            username:
              type: string
            email:
              type: string

    Project:
      allOf:
        - $ref: '#/components/schemas/AssetResource'
        - type: object
          required: [projWebsite, projStartDate, projBudget, projStatus]
          properties:
            opportunity:
              nullable: true
            relatedEntity:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [county, state, biome, region, microregion]
                entityId:
                  type: array
                  items:
                    type: string
            relatedEntities:
              type: array
              items:
                type: object
            projWebsite:
              type: string
            projStartDate:
              type: string
              format: date-time
            projEndDate:
              type: string
              format: date-time
              nullable: true
            projBudget:
              type: number
            currency:
              type: string
            projStatus:
              type: string
            projComments:
              type: array
              items:
                type: string
            projDocuments:
              type: array
              items:
                type: string
            obs:
              type: string
            areas:
              type: array
              items:
                type: string

    CreateProjectRequest:
      type: object
      required: [name, description, projWebsite, projStartDate, projBudget, projStatus]
      properties:
        name:
          type: string
        projName:
          type: string
          description: Alias for name
        description:
          type: string
        opportunity:
          type: string
          nullable: true
        relatedEntity:
          type: object
        projWebsite:
          type: string
        projStartDate:
          type: string
          format: date-time
        projEndDate:
          type: string
          format: date-time
        projBudget:
          type: number
        currency:
          type: string
        projStatus:
          type: string

    ActionLog:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          nullable: true
        username:
          type: string
        action:
          type: string
          example: auth.login
        resourceType:
          type: string
          example: AUTH
        resourceId:
          type: string
          nullable: true
        method:
          type: string
          example: POST
        path:
          type: string
          example: /api/auth/login
        statusCode:
          type: integer
          example: 200
        success:
          type: boolean
        message:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        clientApp:
          type: string
        meta:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasPrev:
          type: boolean
        hasNext:
          type: boolean

    ListSortMeta:
      type: object
      properties:
        field:
          type: string
        order:
          type: string
          enum: [asc, desc]

    ActionLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionLog'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    GeoRef:
      type: object
      description: Populated parent geography document (code + name).
      properties:
        _id:
          type: string
        code:
          type: string
        name:
          type: string

    Region:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
          example: NE
        name:
          type: string
          example: Nordeste
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    State:
      allOf:
        - $ref: '#/components/schemas/Region'
        - type: object
          properties:
            region:
              oneOf:
                - type: string
                - $ref: '#/components/schemas/GeoRef'

    Microregion:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
          nullable: true
          example: BA01
        name:
          type: string
          example: Salvador
        region:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/GeoRef'
        state:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/GeoRef'
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    StateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/State'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    MicroregionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Microregion'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    Biome:
      $ref: '#/components/schemas/Region'

    BiomeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Biome'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    YearlyValue:
      type: object
      properties:
        value:
          type: number
        year:
          type: integer

    EndangeredPeople:
      type: object
      properties:
        value:
          type: number
        year:
          type: integer
        riskType:
          type: string

    CountyStatus:
      type: object
      properties:
        endangeredPeople:
          type: array
          items:
            $ref: '#/components/schemas/EndangeredPeople'
        disasterRate:
          type: array
          items:
            $ref: '#/components/schemas/YearlyValue'
        hidroRisk:
          type: array
          items:
            $ref: '#/components/schemas/YearlyValue'

    County:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        code:
          type: string
        IBGECode:
          type: string
        population:
          type: number
        region:
          $ref: '#/components/schemas/GeoRef'
        state:
          $ref: '#/components/schemas/GeoRef'
        microregion:
          $ref: '#/components/schemas/GeoRef'
        biome:
          $ref: '#/components/schemas/GeoRef'
        status:
          $ref: '#/components/schemas/CountyStatus'

    CountyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/County'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

    CountyEmission:
      type: object
      properties:
        _id:
          type: string
        county:
          type: string
        actionType:
          type: string
        gasType:
          type: string
        value:
          type: number
        year:
          type: integer
        sector:
          type: string
        category:
          type: string
        subCategory:
          type: string
        product:
          type: string
        detail:
          type: string
        activity:
          type: string

    CountyEmissionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CountyEmission'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        sort:
          $ref: '#/components/schemas/ListSortMeta'

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: |
        Creates an unverified account (`isVerified: false`). Sends a verification email
        to the registered address. The user cannot sign in until they verify via the email
        link or an administrator sets `isVerified` to true.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered (unverified; cannot sign in yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation or duplicate user error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address
      description: Marks the user verified when the emailed token is valid and not expired.
      operationId: verifyEmail
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token

  /api/auth/google/status:
    get:
      tags: [Auth]
      summary: Whether Google OAuth is configured
      operationId: googleAuthStatus
      responses:
        '200':
          description: Configuration flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth
      description: Redirects to Google. Requires GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
      operationId: startGoogleAuth
      responses:
        '302':
          description: Redirect to Google
        '503':
          description: Google OAuth not configured

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      operationId: googleAuthCallback
      responses:
        '302':
          description: Redirect to app home or login with reason

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and create a DB-backed session JWT
      description: |
        Creates a MongoDB session document (shared auth store) and returns a JWT whose `sid`
        claim matches the session. Other apps can validate the same token via `/api/auth/validate`
        or by reading the `sessions` collection.

        Browsers also receive an httpOnly `rbac_session` cookie (SameSite=Lax). The SPA should
        call APIs with `credentials: include` and does not need to store the JWT in localStorage.
        The JSON `token` field remains for API clients (Postman, scripts).

        Authenticate with the registered `email` and `password` (username is not accepted).
        Login requires `user.isVerified === true`. Self-registered users default to unverified
        until they complete email verification or an administrator sets `isVerified`
        (for example via `PUT /api/users/{id}`).
        Admin-created users, Google sign-in (verified Google email), and the bootstrap admin
        are verified automatically.
        Successful login updates `lastLoginAt`.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful (also sets httpOnly session cookie)
          headers:
            Set-Cookie:
              description: httpOnly session cookie (`rbac_session`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account exists but is not verified (`NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke the current session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user, session, and effective permissions
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile
        '401':
          description: Session missing, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/validate:
    get:
      tags: [Auth]
      summary: Validate bearer session for shared authentication
      operationId: validateSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session is valid
        '401':
          description: Session invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for the authenticated user
      description: Revokes all of the user's active sessions after a successful change.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      description: |
        Users with `USER:READ` see all active sessions. Others see only their own.
        Supports pagination, search (`q`), and filters. Response includes `items`
        (alias of `sessions`) plus `pagination` and `sort`.
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [username, clientApp, ipAddress, lastSeenAt, expiresAt, createdAt]
            default: lastSeenAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          schema:
            type: string
          description: Search username, clientApp, ipAddress, or userAgent
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: clientApp
          schema:
            type: string
      responses:
        '200':
          description: Paginated active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                    enum: [all, self]
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRecord'
                    description: Compatibility alias of items
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Disconnect a session
      description: Users can disconnect their own sessions. `USER:WRITE` can disconnect any session.
      operationId: disconnectSession
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session disconnected
        '403':
          description: Not allowed to disconnect this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/forgot-password:
    get:
      tags: [Auth]
      summary: Request password reset
      description: |
        Always returns the same 200 message whether or not the email exists (no user enumeration).
        When a matching account exists, a one-time raw token is emailed and only its SHA-256 hash
        is stored on the user document (`resetTokenHash`).
      operationId: forgotPassword
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Generic acknowledgement (email sent only if the account exists)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '400':
          description: Invalid, expired, or missing password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Paginated user list with search, filters, and sort.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [username, email, createdAt, lastLoginAt, isVerified, isEnabled]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: q
          schema:
            type: string
          description: Search username or email
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: isVerified
          schema:
            type: boolean
        - in: query
          name: isEnabled
          schema:
            type: boolean
        - in: query
          name: organizationId
          schema:
            type: string
          description: Only users belonging to this organization
        - in: query
          name: groupId
          schema:
            type: string
          description: Only users who are members of this group
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Unauthorized
    post:
      tags: [Users]
      summary: Create user
      description: |
        Admin-provisioned users are created with `isVerified: true` so they can sign in immediately.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created (verified)
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Users]
      summary: Update user
      description: |
        Whitelisted fields only: `username`, `email`, `isVerified`, `isEnabled`, `organization`, `language`.
        Setting `isVerified` is how admins grant or revoke sign-in for self-registered accounts.
        Setting `isEnabled` to false disconnects sessions (ACCOUNT_DISABLED).
        Password, roleId, isAdmin, and reset tokens cannot be set here.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                isVerified:
                  type: boolean
      responses:
        '200':
          description: User updated
        '400':
          description: No allowed fields or invalid isVerified type
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [Users]
      summary: Move user to recycle bin
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User moved to recycle bin
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/users/{id}/password:
    post:
      tags: [Users]
      summary: Admin reset of another user's password
      description: Requires `USER:WRITE`. Revokes all of the target user's sessions.
      operationId: adminChangeUserPassword
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found

  /api/groups:
    get:
      tags: [Groups]
      summary: List groups
      description: Paginated group list with search, filters, and sort.
      operationId: listGroups
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, createdAt, updatedAt, memberCount]
            default: name
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: q
          schema:
            type: string
          description: Search name or description
        - in: query
          name: name
          schema:
            type: string
      responses:
        '200':
          description: Paginated group list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  sort:
                    $ref: '#/components/schemas/ListSortMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    post:
      tags: [Groups]
      summary: Create group
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/groups/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Groups]
      summary: Update group
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [Groups]
      summary: Move group to recycle bin
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group moved to recycle bin
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/groups/{groupId}/members:
    post:
      tags: [Groups]
      summary: Add member to group
      operationId: addGroupMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
      responses:
        '200':
          description: Member added
        '400':
          description: Missing target user
        '401':
          description: Unauthorized
        '404':
          description: Group or user not found
    delete:
      tags: [Groups]
