      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [county, state, region]
        - in: query
          name: id
          schema:
            type: string
          description: County, state, or region ObjectId (`subjectId`)
        - in: query
          name: source
          schema:
            type: string
            enum: [pib, pam, ppm, cempre, pia, munic, siconfi, transfers, emendas]
        - in: query
          name: series
          schema:
            type: string
        - in: query
          name: year
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: sort
          schema:
            type: string
            enum: [year, series, source, value]
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
