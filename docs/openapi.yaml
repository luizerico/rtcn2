      summary: Update group permissions (deprecated)
      description: >
        Deprecated. Use POST /api/permissions/acl instead. This endpoint only
        replaces this group's grants for the selected assets (or class-wide *);
        it does not wipe unrelated instance grants for the same resource type.
        Responses include Deprecation and Link headers pointing at the successor.
